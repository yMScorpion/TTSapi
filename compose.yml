version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NGC_TAG: 24.08-py3
    image: styletts2-api:latest
    container_name: styletts2-api
    ports:
      - "8000:8000"
    environment:
      - JWT_SECRET=${JWT_SECRET:-changeme}
      - AUTH_USERNAME=${AUTH_USERNAME:-admin}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-admin}
      - ENABLE_AMP=${ENABLE_AMP:-1}
      - PROMETHEUS=${PROMETHEUS:-1}
      - RATE_LIMIT=${RATE_LIMIT:-10}
      - MODEL_AUTO_DOWNLOAD=${MODEL_AUTO_DOWNLOAD:-1}
      - MODELS=${MODELS:-LJSpeech,LibriTTS}
      - HF_HOME=/cache/huggingface
    volumes:
      - ./Models:/workspace/StyleTTS2/Models
      - ./Voices:/workspace/StyleTTS2/Voices
      - hf-cache:/cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    shm_size: "1g"
    gpus: all
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=yesoreyeram-infinity-datasource
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  hf-cache:
  grafana-data: